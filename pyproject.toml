[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-harris-corner-feature-detector-skill"
version = "1.0.0"
description = "Harris corner and salient feature detector using spatial gradient autocorrelation matrix analysis."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-harris-corner-feature-detector-skill"
Repository = "https://github.com/alphaparkinc/genpark-harris-corner-feature-detector-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-harris-corner-feature-detector-skill/issues"
